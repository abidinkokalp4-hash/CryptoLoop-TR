name: Verify and Build Android Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cryptoloop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Flutter strategy, market and UI tests
        run: flutter test --reporter expanded
      - name: Backend security and execution tests
        run: python3 -m unittest discover -s backend/tests -v
      - name: Read-only public market probe
        run: dart run scripts/probe_market.dart
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK payload, permission and signature
        run: python3 scripts/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLoop-TR-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLoop-TR-verification-${{ github.run_number }}
          path: build/qa/
          if-no-files-found: warn
