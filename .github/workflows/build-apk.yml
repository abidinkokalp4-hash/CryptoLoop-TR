name: Verify and Build Android Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cryptoloop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Flutter strategy, market and UI tests
        run: flutter test --reporter expanded
      - name: Backend security and execution tests
        run: python3 -m unittest discover -s backend/tests -v
      - name: Read-only public market probe
        run: dart run scripts/probe_market.dart
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK payload, permission and signature
        run: python3 scripts/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLoop-TR-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLoop-TR-verification-${{ github.run_number }}
          path: build/qa/
          if-no-files-found: warn
  android-device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: CryptoLoop-TR-release-${{ github.run_number }}
          path: build/ci-release
      - name: Enable KVM for disposable Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated paper device tests
        run: |
          flutter pub get
          flutter build apk --debug -t integration_test/background_test.dart --target-platform android-x64
      - name: Native foreground lifecycle and release launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r -g build/app/outputs/flutter-apk/app-debug.apk
            python3 scripts/run_device_tests.py
            python3 scripts/device_release_smoke.py build/ci-release/app-release.apk
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p build/qa/device
          timeout 10s adb logcat -d > build/qa/device/emulator-logcat.txt || true
      - name: Upload Android verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLoop-TR-android-${{ matrix.api }}-${{ github.run_number }}
          path: |
            build/qa/device/
            build/integration_response_data.json
          if-no-files-found: warn
